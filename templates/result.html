<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <style>
        :root {
            --bg-base: #0f1017;
            --text-main: #e2e5f0;
            --text-muted: #8a8fca;
            --accent: #6366f1;
            --card-wrapper-bg: rgba(22, 24, 38, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 90% 10%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 10% 90%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.005) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.005) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            z-index: 10;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
            padding: 8px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
        }

        .btn-back:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.07);
        }

        .results-wrapper {
            width: 100%;
            max-width: 800px;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Ambient floating shapes specifically for results page background */
        .decoration-blob {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: pulseSlow 8s infinite ease-in-out;
        }

        @keyframes pulseSlow {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.15; }
            50% { transform: scale(1.1) rotate(45deg); opacity: 0.25; }
        }
    </style>
</head>
<body>

    <svg class="decoration-blob" style="top: 15%; left: 5%;" width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 10H40V40H10V10Z" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
        <path d="M80 80H110V110H80V80Z" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="40" y1="40" x2="80" y2="80" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>
    </svg>

    <div class="action-bar">
        <a href="/" class="btn-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Generate Another Quiz
        </a>
    </div>

    <div class="results-wrapper">
        {{ result|safe }}
    </div>

</body>
</html>
